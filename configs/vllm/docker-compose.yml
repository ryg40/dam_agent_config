services:
  vllm-openai:
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "1,2"
              capabilities:
                - gpu
    volumes:
      - /data/.cache/huggingface:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN:?HF_TOKEN must be set in .env}
      #- CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=0,1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ports:
      - 8001:8000
    ipc: host
    image: vllm/vllm-openai:v0.20.0-cu130
    networks:
      llama-vllm-shared:
        ipv4_address: 172.30.0.21
    entrypoint:
      - /bin/bash
      - -c
    command:
      - >
        # Apply SM120 TMA patch for Blackwell GPUs

        UTILS_FILE=$(python3 -c "import vllm, os; print(os.path.join(os.path.dirname(vllm.__file__), 'model_executor/layers/fla/ops/utils.py'))")

        sed -i 's/is_nvidia and torch.cuda.get_device_capability(0)\[0\] >= 9/is_nvidia and 9 <= torch.cuda.get_device_capability(0)[0] < 12/' "$$UTILS_FILE"

        echo "Applied SM120 TMA patch to: $$UTILS_FILE"


        exec vllm serve llmfan46/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-NVFP4 \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 2 \
          --max-model-len 120000 \
          --gpu-memory-utilization 0.88 \
          --kv-cache-dtype fp8 \
          --max-num-seqs 2 \
          --max-num-batched-tokens 8192 \
          --reasoning-parser qwen3 \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --served-model-name qwen3.6-27b \
          --enable-prefix-caching \
          --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3}' \
          --default-chat-template-kwargs '{"enable_thinking":true, "preserve_thinking":false}' \
          --limit-mm-per-prompt '{"image": 0, "video": 0, "audio": 0}' \
          --language-model-only \
          --override-generation-config '{
              "temperature": 0.60,
              "presence_penalty": 0.0,
              "repetition_penalty": 1.0   }'
networks:
  llama-vllm-shared:
    external: true
